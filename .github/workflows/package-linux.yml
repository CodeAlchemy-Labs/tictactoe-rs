name: Package Linux
on: workflow_dispatch
jobs:
  deb:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: fish packaging/linux/build-deb.fish
      - uses: actions/upload-artifact@v4
        with:
          name: tictacli-deb
          path: dist/linux/*.deb

  rpm:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - run: fish packaging/linux/build-rpm.fish
      - uses: actions/upload-artifact@v4
        with:
          name: tictacli-rpm
          path: dist/linux/*.rpm

  arch:
    runs-on: ubuntu-22.04
    container:
      image: archlinux:latest
    steps:
      - uses: actions/checkout@v4
      - run: pacman -Syu --noconfirm base-devel cargo rust
      - run: useradd -m builduser && chown -R builduser:builduser .
      - run: su - builduser -c "fish packaging/linux/build-arch.fish" || su - builduser -c "cd packaging/linux/arch && cp PKGBUILD-tictacli PKGBUILD && makepkg --noconfirm && cp PKGBUILD-tictacli-server PKGBUILD && makepkg --noconfirm && mkdir -p ../../../dist/linux && mv *.pkg.tar.zst ../../../dist/linux/"
      - uses: actions/upload-artifact@v4
        with:
          name: tictacli-arch
          path: dist/linux/*.pkg.tar.zst

  musl:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: fish packaging/linux/build-musl.fish
      - uses: actions/upload-artifact@v4
        with:
          name: tictacli-musl
          path: dist/linux/*.tar.gz

# Note: The .deb and .rpm files produced by this workflow are not signed yet.
# Please use --allow-unsafe-permissions or equivalent if needed, though they
# should install fine without signing for local tests.
