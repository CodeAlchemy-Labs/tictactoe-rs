name: Package Windows Legacy

on:
  workflow_dispatch:

jobs:
  build-legacy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.77.2 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          targets: x86_64-pc-windows-gnu, i686-pc-windows-gnu

      - name: Install MinGW and Windows packaging dependencies
        shell: powershell
        run: |
          choco install mingw --no-progress
          choco install innosetup --no-progress
          choco install osslsigncode --no-progress

      - name: Install WiX Toolset v4
        shell: powershell
        run: |
          dotnet tool install --global wix --version 4.0.5
          wix extension add WixToolset.UI.wixext/4.0.5 --global

      - name: Build legacy Windows binaries and installers
        shell: powershell
        env:
          WINDOWS_CERTIFICATE_PFX_BASE64: ${{ secrets.WINDOWS_CERTIFICATE_PFX_BASE64 }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          packaging\windows\legacy\build-legacy.ps1

      - name: Upload legacy artefacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-legacy
          path: |
            dist/windows/legacy/tictacli-x86_64-legacy.exe
            dist/windows/legacy/tictacli-i686-legacy.exe
            dist/windows/legacy/tictacli-*-legacy-setup.exe
            dist/windows/legacy/tictacli-*-legacy.msi
          if-no-files-found: error
