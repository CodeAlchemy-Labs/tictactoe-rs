name: Package Windows Legacy

on:
  workflow_dispatch:

jobs:
  build-legacy-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust 1.77 toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.77.2
          targets: x86_64-pc-windows-gnu

      - name: Install MinGW cross toolchain
        shell: powershell
        run: choco install mingw --no-progress

      - name: Build legacy portable bundle
        shell: powershell
        run: |
          cd packaging/windows/legacy
          .\build-legacy.ps1

      - name: Upload legacy artefact
        uses: actions/upload-artifact@v4
        with:
          name: windows-legacy
          path: dist/windows/tictacli-*-legacy-win7.zip
          if-no-files-found: error
