[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.97"
license = "MIT"
authors = ["CodeAlchemy-Labs"]
repository = "https://github.com/CodeAlchemy-Labs/tictactoe-rs"
homepage = "https://github.com/CodeAlchemy-Labs/tictactoe-rs"
readme = "README.md"
description = "A WebSocket-based Tic-Tac-Toe game demonstrating Rust ownership-driven safety guarantees."
keywords = ["websocket", "game", "tictactoe", "async", "axum"]
categories = ["games", "network-programming"]

[workspace.dependencies]
# Config
directories = "5"
toml = "0.8"
tempfile = "3"

# Async runtime
tokio = { version = "1", features = ["full"] }

# WebSocket server
axum = { version = "0.8", features = ["ws"] }

# WebSocket client with TLS. `rustls-tls-native-roots` uses the system CA
# bundle and avoids a link-time dependency on OpenSSL.
tokio-tungstenite = { version = "0.26", features = ["rustls-tls-native-roots"] }

# TLS primitives, used by the client to build an insecure connector for
# `--insecure` mode.
rustls = { version = "0.23", default-features = false, features = ["std", "ring"] }

# Password hashing
argon2 = "0.5"

# Cryptographic randomness. The `getrandom` feature pulls in the OS RNG
# that Argon2 uses to generate salts.
rand_core = { version = "0.6", features = ["getrandom"] }

# Secure zeroing of sensitive buffers
zeroize = "1"

# CLI argument parsing
clap = { version = "4", features = ["derive", "env"] }

# URL parsing
url = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Error handling
thiserror = "2"
anyhow = "1"

# Observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# Terminal UI
ratatui = "0.29"
crossterm = "0.28"

# Async utilities
futures-util = "0.3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
# Deny rust::* warnings, warn on a curated pedantic subset, no blanket allows.
# Full pedantic and nursery are excluded to keep the build green.
[workspace.lints.rust]
# Deny all rust warnings by default
warnings = "deny"

[workspace.lints.clippy]
use_self = "warn"
doc_markdown = "warn"
suboptimal_flops = "warn"
significant_drop_tightening = "warn"
tuple_array_conversions = "warn"
needless_pass_by_value = "warn"
redundant_clone = "warn"
uninlined_format_args = "warn"

[workspace.lints.rustdoc]
broken_intra_doc_links = "warn"
