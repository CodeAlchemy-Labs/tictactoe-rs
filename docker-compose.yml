services:
  server:
    build:
      context: .
      dockerfile: Dockerfile
    image: tictactoe-rs:local
    command: ["tictacli-server"]
    environment:
      TICTACTOE_BIND: "0.0.0.0:8080"
      RUST_LOG: "info"
    ports:
      - "8080:8080"
    networks:
      - tictactoe

  client-1:
    image: tictactoe-rs:local
    depends_on:
      - server
    command:
      - client
      - --server
      - ws://server:8080/ws
      - --name
      - alice
    environment:
      RUST_LOG: "warn"
      TERM: "xterm-256color"
    networks:
      - tictactoe
    profiles:
      - interactive

  client-2:
    image: tictactoe-rs:local
    depends_on:
      - server
    command:
      - client
      - --server
      - ws://server:8080/ws
      - --name
      - bob
    environment:
      RUST_LOG: "warn"
      TERM: "xterm-256color"
    networks:
      - tictactoe
    profiles:
      - interactive

  hacker:
    image: tictactoe-rs:local
    depends_on:
      - server
    command:
      - hacker
      - --target
      - ws://server:8080/ws
      - --scenario
      - all
    environment:
      RUST_LOG: "warn"
    networks:
      - tictactoe
    profiles:
      - demo

networks:
  tictactoe:
    driver: bridge