[package]
name = "server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "WebSocket Tic-Tac-Toe server with deterministic resource cleanup."
keywords.workspace = true
categories.workspace = true

[dependencies]
common = { path = "../common" }
axum.workspace = true
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
argon2.workspace = true
rand_core.workspace = true
zeroize.workspace = true

[dev-dependencies]
tokio-tungstenite.workspace = true
[lints]
workspace = true

[package.metadata.deb]
maintainer = "CodeAlchemy-Labs <maintainers@codealchemy-labs.example>"
copyright = "2026, CodeAlchemy-Labs"
license-file = ["../../LICENSE", "0"]
extended-description = """\
TicTacToe WebSocket server that handles client connections, matchmaking, \
global ranking, and real-time spectating."""
section = "net"
priority = "optional"
depends = "$auto, ca-certificates"
assets = [
    ["target/release/tictacli-server", "usr/bin/", "755"],
    ["packaging/linux/common/tictacli-server.1", "usr/share/man/man1/tictacli-server.1", "644"],
    ["packaging/linux/common/tictacli-server.service", "usr/share/doc/tictacli-server/systemd/tictacli-server.service", "644"],
    ["../../README.md", "usr/share/doc/tictacli-server/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/tictacli-server/CHANGELOG.md", "644"],
]
