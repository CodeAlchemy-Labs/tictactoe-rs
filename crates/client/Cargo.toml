[package]
name = "client"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "Terminal client for tictactoe-rs, built with ratatui."
keywords.workspace = true
categories.workspace = true


[[bin]]
name = "tictacli"
path = "src/main.rs"

[dependencies]
whoami.workspace = true

directories.workspace = true
toml.workspace = true
indexmap.workspace = true
idna.workspace = true
idna_adapter.workspace = true
darling.workspace = true
darling_core.workspace = true
darling_macro.workspace = true
common = { path = "../common" }
tokio.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
futures-util.workspace = true
ratatui.workspace = true
crossterm.workspace = true
tokio-tungstenite.workspace = true
rustls.workspace = true
clap.workspace = true
url.workspace = true
unicode-segmentation.workspace = true

[dev-dependencies]

tempfile.workspace = true
tokio-tungstenite.workspace = true
[lints]
workspace = true

[features]
default = ["modern-console"]
modern-console = ["ratatui/underline-color"]
legacy-console = []

[package.metadata.deb]
maintainer = "CodeAlchemy-Labs <maintainers@codealchemy-labs.example>"
copyright = "2026, CodeAlchemy-Labs"
license-file = ["../../LICENSE", "0"]
extended-description = """\
A terminal TicTacToe client that speaks the WebSocket protocol of the \
tictacli-server. Supports authenticated accounts, global ranking, \
real-time spectating, and a reconnection grace period. Launches a \
connection screen when no server URL and guest name are provided on \
the command line."""
section = "games"
priority = "optional"
depends = "$auto, ca-certificates"
assets = [
    ["target/release/tictacli", "usr/bin/", "755"],
    ["../../packaging/linux/common/tictacli.desktop", "usr/share/applications/", "644"],
    ["../../packaging/linux/common/tictacli.png", "usr/share/icons/hicolor/256x256/apps/tictacli.png", "644"],
    ["../../packaging/linux/common/tictacli.1", "usr/share/man/man1/tictacli.1", "644"],
    ["../../README.md", "usr/share/doc/tictacli/README.md", "644"],
    ["../../CHANGELOG.md", "usr/share/doc/tictacli/CHANGELOG.md", "644"],
]

[package.metadata.generate-rpm]
name = "tictacli"
summary = "TicTacToe WebSocket client"
license = "MIT"
url = "https://github.com/CodeAlchemy-Labs/tictactoe-rs"
assets = [
    { source = "../../target/release/tictacli", dest = "/usr/bin/tictacli", mode = "755" },
    { source = "../../packaging/linux/common/tictacli.desktop", dest = "/usr/share/applications/tictacli.desktop", mode = "644" },
    { source = "../../packaging/linux/common/tictacli.png", dest = "/usr/share/icons/hicolor/256x256/apps/tictacli.png", mode = "644" },
    { source = "../../packaging/linux/common/tictacli.1", dest = "/usr/share/man/man1/tictacli.1", mode = "644", doc = true },
    { source = "../../LICENSE", dest = "/usr/share/licenses/tictacli/LICENSE", mode = "644", doc = true },
]
auto-req = "no"

[package.metadata.generate-rpm.requires]
glibc = ">= 2.28"
ca-certificates = "*"
